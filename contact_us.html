<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styling specific to the Contact Us page layout */
        .contact-container {
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 2rem;
        }

        .contact-container h2 {
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 1rem;
            text-align: center;
        }

        .contact-container p {
            font-size: 1.1rem;
            color: #cbd5e1;
            text-align: center;
            margin-bottom: 2rem;
        }

        .contact-form {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #f8fafc;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            padding: 0.75rem 1rem;
            border-radius: 4px;
            border: 1px solid #475569;
            background-color: #334155;
            color: #ffffff;
            outline: none;
            font-size: 1rem;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
            padding: 0.75rem;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <h2>TravelBloom</h2>
        </div>
        <ul class="nav-links">
            <li><a href="travel_recommendation.html">Home</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="contact_us.html">Contact Us</a></li>
        </ul>
    </nav>

    <!-- Contact Form Section -->
    <header class="hero-section" style="height: 40vh;">
    <div class="hero-content">
        <h2>Contact Us</h2>
        <p>Get in touch with us for inquiries, feedback, or collaboration suggestions.</p>
    </div>
</header>
      <div class="contact-container" style="margin-top: 2rem;">
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you for contacting TravelBloom! We will get back to you soon.');">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" class="submit-btn">Send Message</button>
        </form>
    </div>

</body>
</html>
