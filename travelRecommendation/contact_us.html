<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <h2>TravelBloom</h2>
    </div>
    <ul class="nav-links">
      <li><a href="travel_recommendation.html">Home</a></li>
      <li><a href="about_us.html">About Us</a></li>
      <li><a href="contact_us.html">Contact Us</a></li>
    </ul>
  </nav>
  <div class="class-container">
    <form class="contact-form" onsubmit="event.preventDeault(); alert('Message submitted successfully!');">
        <h1>CONTACT US</h1>
         <p>Get in touch with us for inquiries and suggestions.</p>
      
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Enter your message" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
